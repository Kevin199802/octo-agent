<!doctype html>
<html lang="zh-CN" style="background:#0f0f0f">
  <head>
    <meta charset="UTF-8" />
    <title>Octo Agent</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #0f0f0f;
        color: #888;
        font-family: -apple-system, sans-serif;
        font-size: 14px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #333;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <span>正在启动…</span>
  </body>
  <script>
    // 通知主进程加载窗口已就绪，主进程收到后才会打开主窗口
    window.addEventListener("DOMContentLoaded", () => {
      window.api?.loadingWindowComplete()
    })
  </script>
</html>
