<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>半导体良率分析仪表盘</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- D3.js for Charting -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f3f4f6; }
    .cursor-context-menu { cursor: context-menu; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ---------------------------------------------------------
    // 1. 各个图表类型的独立模拟数据集
    // ---------------------------------------------------------
    const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444"];
    const equipments = ["EQP-A100", "EQP-B250", "EQP-C300", "EQP-D400"];
    const waferIds = Array.from({ length: 23 }, (_, i) => `W${String(i + 1).padStart(2, '0')}`);

    const generateDistributionData = (name, index, baseMean, varianceBase, customColor, dataCount = 150, spread = 0.45) => {
      const variance = varianceBase + Math.random() * (varianceBase * 1.5);
      const data = Array.from({ length: dataCount }, () => d3.randomNormal(baseMean, variance)());
      data.sort(d3.ascending);

      const q1 = d3.quantile(data, 0.25);
      const median = d3.quantile(data, 0.5);
      const q3 = d3.quantile(data, 0.75);
      const iqr = q3 - q1;
      const min = Math.max(d3.min(data), q1 - 1.5 * iqr);
      const max = Math.min(d3.max(data), q3 + 1.5 * iqr);
      
      const outliers = data.filter(d => d < min || d > max);

      const rawData = data.map(val => ({
        value: val,
        jitterOffset: (Math.random() - 0.5) * spread
      }));

      return { name, q1, median, q3, iqr, min, max, outliers, rawData, color: customColor || colors[index % colors.length] };
    };

    const datasetBox1 = equipments.map((eqp, i) => generateDistributionData(eqp, i, 100, 10, null, 400, 0.7));
    const datasetBox2 = waferIds.map((wid, i) => generateDistributionData(wid, i, 350, 40, colors[0], 100, 0.45));

    const scatterGroups = [
      { name: 'SVT', color: '#10b981', baseIdsat: 40, baseVtsat: 0.6 },
      { name: 'LVT', color: '#3b82f6', baseIdsat: 80, baseVtsat: 0.4 },
      { name: 'ULVT', color: '#f59e0b', baseIdsat: 120, baseVtsat: 0.2 },
    ];

    const datasetScatter = (() => {
      let data = [];
      scatterGroups.forEach(group => {
        for(let i = 0; i < 150; i++) {
          const idsat = d3.randomNormal(group.baseIdsat, 12)();
          const vtsat = group.baseVtsat - (idsat - group.baseIdsat) * 0.005 + d3.randomNormal(0, 0.04)();
          data.push({ group: group.name, color: group.color, idsat, vtsat });
        }
      });
      return data;
    })();

    const lineProducts = [
      { name: 'Product A', color: '#3b82f6', base: 92 },
      { name: 'Product B', color: '#10b981', base: 90 }
    ];

    // 折线图数据点数量减少至26，保持稀疏视觉
    const datasetLine = lineProducts.map((p, pIdx) => ({
      name: p.name,
      color: p.color,
      data: Array.from({length: 26}, (_, i) => {
        const randomSpike = Math.random() > 0.85 ? (Math.random() * 8 - 4) : 0;
        const baseWave = Math.sin(i / (3 + pIdx)) * 4;
        return {
          x: `Lot-${String(i + 1).padStart(3, '0')}`,
          y: Math.min(99.9, Math.max(70, p.base + baseWave + Math.random() * 5 - 2.5 + randomSpike))
        };
      })
    }));

    const datasetBar = [
      { category: 'Particle', count: 145 },
      { category: 'Scratch', count: 112 },
      { category: 'Pattern', count: 88 },
      { category: 'Resist', count: 64 },
      { category: 'Etch', count: 52 },
      { category: 'CMP', count: 41 },
      { category: 'EPI', count: 28 },
      { category: 'Implant', count: 19 },
      { category: 'Void', count: 12 },
      { category: 'Metal', count: 8 }
    ].map(d => ({ ...d, color: '#3b82f6' }));

    const getChartData = (type) => {
      switch(type) {
        case 'box 1': return datasetBox1;
        case 'box 2': return datasetBox2;
        case 'scatter': return datasetScatter;
        case 'line': return datasetLine;
        case 'bar': return datasetBar;
        default: return datasetBox1;
      }
    };

    // ---------------------------------------------------------
    // 2. 响应式图表组件 (多态核心: 动态坐标轴与图元)
    // ---------------------------------------------------------
    const ResponsiveChart = ({ width, height, type = 'box 1', forceDefault = false }) => {
      const svgRef = useRef(null);
      const data = useMemo(() => getChartData(type), [type]);

      const isLayoutSmall = width < 400;
      const isLayoutShort = height < 350;

      const chartConfig = useMemo(() => {
        switch(type) {
            case 'box 1': return { title: 'Idsat 参数分布', x: '设备 (Equipment ID)', y: 'Idsat Value (mA)' };
            case 'box 2': return { title: 'RV3W0RST 参数分布', x: 'Wafer ID', y: 'RV3W0RST' };
            case 'scatter': return { title: 'Idsat 与 Vtsat 关联分析', x: 'Idsat Value (mA)', y: 'Vtsat Value (V)' };
            case 'line': return { title: '多产品良率趋势 (Trend)', x: '批次 (Lot)', y: '良率 Yield (%)' };
            case 'bar': return { title: '缺陷类型分布 (Pareto)', x: '缺陷类别 (Defect)', y: '数量 (Count)' };
            default: return { title: '', x: '', y: '' };
        }
      }, [type]);

      const margin = { top: 40, right: 120, bottom: 90, left: 60 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const xScale = useMemo(() => {
        if (type === 'scatter') {
          const xExtent = d3.extent(data, d => d.idsat);
          const padding = (xExtent[1] - xExtent[0]) * 0.1;
          return d3.scaleLinear().domain([xExtent[0] - padding, xExtent[1] + padding]).range([0, innerWidth]);
        } else if (type === 'line') {
          return d3.scalePoint().domain(data[0].data.map(d => d.x)).range([0, innerWidth]).padding(0.5);
        } else if (type === 'bar') {
          return d3.scaleBand().domain(data.map(d => d.category)).range([0, innerWidth]).paddingInner(0.3).paddingOuter(0.2);
        } else {
          return d3.scaleBand().domain(data.map(d => d.name)).range([0, innerWidth]).paddingInner(0.2).paddingOuter(0.2);
        }
      }, [data, innerWidth, type]);

      const yScale = useMemo(() => {
        if (type === 'scatter') {
          const yExtent = d3.extent(data, d => d.vtsat);
          const padding = (yExtent[1] - yExtent[0]) * 0.1;
          return d3.scaleLinear().domain([yExtent[0] - padding, yExtent[1] + padding]).range([innerHeight, 0]);
        } else if (type === 'line') {
          const allY = data.flatMap(series => series.data.map(d => d.y));
          const yMin = d3.min(allY) * 0.98;
          return d3.scaleLinear().domain([yMin, 100]).range([innerHeight, 0]);
        } else if (type === 'bar') {
          const yMax = d3.max(data, d => d.count) * 1.15;
          return d3.scaleLinear().domain([0, yMax]).range([innerHeight, 0]);
        } else {
          const allValues = data.flatMap(d => d.rawData.map(pt => pt.value));
          const yMin = d3.min(allValues) * 0.95;
          const yMax = d3.max(allValues) * 1.05;
          return d3.scaleLinear().domain([yMin, yMax]).range([innerHeight, 0]);
        }
      }, [data, innerHeight, type]);

      useEffect(() => {
        if (!svgRef.current || innerWidth <= 0 || innerHeight <= 0) return;
        const svg = d3.select(svgRef.current);
        svg.selectAll(".axis-g").remove();

        const xAxisGroup = svg.append("g").attr("class", "axis-g").attr("transform", `translate(${margin.left},${margin.top + innerHeight})`);
        let xAxis = d3.axisBottom(xScale);
        
        if (type !== 'scatter') {
            const domain = xScale.domain();
            const bandWidth = innerWidth / Math.max(1, domain.length);
            // 刻度布局纯由物理尺寸控制，不随 forceDefault 还原
            const needVertical = bandWidth < 60;
            
            let tickValues = domain;
            if (needVertical && bandWidth < 14) {
                const step = Math.ceil(14 / bandWidth);
                tickValues = domain.filter((_, i) => i % step === 0);
            }

            xAxis.tickValues(tickValues);
            xAxisGroup.call(xAxis);

            if (needVertical) {
                xAxisGroup.selectAll("text").style("text-anchor", "end").attr("dx", "-0.8em").attr("dy", "-0.25em").attr("transform", "rotate(-90)");
            } else {
                xAxisGroup.selectAll("text").style("text-anchor", "middle").attr("dx", "0").attr("dy", "0.71em").attr("transform", "none");
            }
        } else {
            xAxis.ticks(Math.max(2, Math.floor(innerWidth / 60)));
            xAxisGroup.call(xAxis);
        }

        const yAxisGroup = svg.append("g").attr("class", "axis-g").attr("transform", `translate(${margin.left},${margin.top})`);
        
        const defaultYTicks = yScale.ticks(8);
        const yTickValues = isLayoutShort ? defaultYTicks.filter((_, i) => i % 2 === 0) : defaultYTicks;

        let yAxis = d3.axisLeft(yScale).tickValues(yTickValues);
        if (type === 'line') yAxis.tickFormat(d => `${d}%`);
        yAxisGroup.call(yAxis);

        const yAxisGrid = d3.axisLeft(yScale).tickSize(-innerWidth).tickFormat('').tickValues(yTickValues);
        svg.append('g').attr('class', 'axis-g grid-lines text-gray-100').attr('transform', `translate(${margin.left}, ${margin.top})`).call(yAxisGrid)
          .selectAll("line").style("stroke", "#f3f4f6");
        svg.select('.grid-lines .domain').remove();

      }, [xScale, yScale, isLayoutSmall, isLayoutShort, innerWidth, innerHeight, margin.left, margin.top, type]);

      if (innerWidth <= 0 || innerHeight <= 0) return null;

      // 只有图形元素受 forceDefault 开关控制
      const shouldAggregateBox1 = type === 'box 1' && width <= 500 && !forceDefault;
      const shouldShowMedianLineBox2 = type === 'box 2' && width <= 500 && !forceDefault;
      const isScatterNarrow = type === 'scatter' && width <= 500 && !forceDefault;
      const isLineNarrow = type === 'line' && width <= 500 && !forceDefault;

      let renderScatterData = [];
      if (type === 'scatter') {
        if (isScatterNarrow) {
          const xExtent = d3.extent(data, d => d.idsat);
          const yExtent = d3.extent(data, d => d.vtsat);
          
          const xTicks = d3.ticks(xExtent[0], xExtent[1], 15);
          const yTicks = d3.ticks(yExtent[0], yExtent[1], 12);
          const xDataStep = xTicks[1] - xTicks[0] || 1;
          const yDataStep = yTicks[1] - yTicks[0] || 1;

          const bins = new Map();
          let maxCount = 0;

          data.forEach(d => {
            const gx = Math.floor((d.idsat - xExtent[0]) / xDataStep);
            const gy = Math.floor((d.vtsat - yExtent[0]) / yDataStep);
            const key = `${gx}_${gy}_${d.group}`;

            if (!bins.has(key)) {
              bins.set(key, { sumX: d.idsat, sumY: d.vtsat, count: 1, color: d.color, group: d.group });
            } else {
              const bin = bins.get(key);
              bin.sumX += d.idsat;
              bin.sumY += d.vtsat;
              bin.count += 1;
            }
          });

          const binWidthPx = Math.abs(xScale(xExtent[0] + xDataStep) - xScale(xExtent[0]));
          const binHeightPx = Math.abs(yScale(yExtent[0]) - yScale(yExtent[0] + yDataStep));
          const maxR = Math.max(12, Math.min(binWidthPx, binHeightPx) / 2 * 1.8);
          const minR = 1.5;

          renderScatterData = Array.from(bins.values()).map(bin => {
            if (bin.count > maxCount) maxCount = bin.count;
            return {
              cx: xScale(bin.sumX / bin.count),
              cy: yScale(bin.sumY / bin.count),
              count: bin.count,
              color: bin.color,
              isAggregated: true
            };
          });

          renderScatterData.forEach(d => {
             d.r = maxCount === 1 ? minR : minR + Math.pow(d.count / maxCount, 1.5) * (maxR - minR);
          });

          renderScatterData.sort((a, b) => b.count - a.count);

        } else {
          renderScatterData = data.map(d => ({ cx: xScale(d.idsat), cy: yScale(d.vtsat), r: 4, color: d.color, isAggregated: false }));
        }
      }

      return (
        <div className="relative w-full h-full bg-white select-none overflow-hidden" style={{ width, height }}>
          {/* 内部完全去除了悬浮的开关，所有图表级开关交由外层弹窗控制 */}
          <svg width={width} height={height} className="block w-full h-full absolute inset-0">
            <svg ref={svgRef} className="overflow-visible" />
            <g transform={`translate(${margin.left},${margin.top})`}>
              
              <text x={innerWidth / 2} y={-margin.top / 2} textAnchor="middle" className="text-gray-700 font-semibold fill-current" fontSize={isLayoutSmall ? "12px" : "16px"}>
                  {isLayoutSmall ? chartConfig.title.split(' ')[0] : chartConfig.title}
              </text>

              <text x={innerWidth / 2} y={innerHeight + 75} textAnchor="middle" fontSize="12px" fill="#6b7280">{chartConfig.x}</text>
              <text transform="rotate(-90)" x={-innerHeight / 2} y={-45} textAnchor="middle" fontSize="12px" fill="#6b7280">{chartConfig.y}</text>

              {/* --- SCATTER 绘制逻辑 --- */}
              {type === 'scatter' && renderScatterData.map((pt, idx) => (
                pt.isAggregated ? (
                  <circle key={`spt-agg-${idx}`} cx={pt.cx} cy={pt.cy} r={pt.r} fill={pt.color} fillOpacity={0.15} stroke={pt.color} strokeWidth={1.5} />
                ) : (
                  <circle key={`spt-${idx}`} cx={pt.cx} cy={pt.cy} r={pt.r} fill={pt.color} fillOpacity={0.7} />
                )
              ))}

              {/* --- LINE 绘制逻辑 --- */}
              {type === 'line' && data.map((series, sIdx) => (
                <g key={`series-${sIdx}`}>
                   <path
                     d={d3.line().x(d => xScale(d.x)).y(d => yScale(d.y))(series.data)}
                     fill="none"
                     stroke={series.color}
                     strokeWidth={2}
                     opacity={isLineNarrow ? 0.4 : 1}
                   />
                   
                   {series.data.map((d, i) => {
                     if (isLineNarrow) {
                       const currentY = d.y;
                       const prevY = i > 0 ? series.data[i - 1].y : null;
                       const nextY = i < series.data.length - 1 ? series.data[i + 1].y : null;
                       
                       const isPeak = (prevY === null || currentY > prevY) && (nextY === null || currentY > nextY);
                       const isValley = (prevY === null || currentY < prevY) && (nextY === null || currentY < nextY);
                       
                       if (isPeak || isValley) {
                         // 波峰波谷的小横线长度为 6px
                         return <rect key={`linept-${sIdx}-${i}`} x={xScale(d.x) - 3} y={yScale(d.y) - 0.75} width={6} height={1.5} fill={series.color} />;
                       } else {
                         // 普通点的小竖线长度为 6px
                         return <rect key={`linept-${sIdx}-${i}`} x={xScale(d.x) - 0.75} y={yScale(d.y) - 3} width={1.5} height={6} fill={series.color} />;
                       }
                     } else {
                       return <circle key={`linept-${sIdx}-${i}`} cx={xScale(d.x)} cy={yScale(d.y)} r={4} fill={series.color} />;
                     }
                   })}
                </g>
              ))}

              {/* --- BAR 绘制逻辑 --- */}
              {type === 'bar' && data.map((d, i) => {
                const barW = Math.min(xScale.bandwidth(), 60);
                return <rect key={`bar-${i}`} x={xScale(d.category) + (xScale.bandwidth() - barW)/2} y={yScale(d.count)} width={barW} height={Math.max(0, innerHeight - yScale(d.count))} fill={d.color} fillOpacity={0.85} rx={3} />;
              })}

              {shouldShowMedianLineBox2 && (
                <path d={d3.line().x(d => xScale(d.name) + xScale.bandwidth() / 2).y(d => yScale(d.median))(data)} fill="none" stroke={colors[0]} strokeWidth={2} opacity={0.8} />
              )}

              {(type === 'box 1' || type === 'box 2') && data.map((d, i) => {
                const xPos = xScale(d.name) + xScale.bandwidth() / 2;
                const boxWidth = Math.min(60, xScale.bandwidth());

                return (
                  <g key={i} transform={`translate(${xPos},0)`}>
                    {(type === 'box 1' || type === 'box 2') && (
                      shouldAggregateBox1 ? (
                        (() => {
                          const thresholds = 35;
                          const bins = d3.bin().domain([yScale.domain()[0], yScale.domain()[1]]).thresholds(thresholds)(d.rawData.map(pt => pt.value));
                          const maxCount = Math.max(1, d3.max(bins, b => b.length));

                          return bins.map((bin, bIdx) => {
                            if (bin.length === 0) return null;
                            const pillWidth = Math.max(4, (bin.length / maxCount) * (boxWidth * 0.7));
                            
                            const yTop = yScale(bin.x1);
                            const yBottom = yScale(bin.x0);
                            const binHeight = yBottom - yTop;
                            
                            const rectHeight = Math.min(8, Math.max(2, binHeight * 0.85));
                            const yCenter = yTop + binHeight / 2;

                            return <rect key={`pill-${bIdx}`} x={-pillWidth / 2} y={yCenter - rectHeight / 2} width={pillWidth} height={rectHeight} rx={rectHeight / 2} fill={d.color} fillOpacity={0.8} />;
                          });
                        })()
                      ) : (
                        !shouldShowMedianLineBox2 ? (
                          d.rawData.map((pt, idx) => (
                            <circle key={`pt-${idx}`} cx={pt.jitterOffset * boxWidth} cy={yScale(pt.value)} r={type === 'box 1' ? 1.5 : 2} fill={d.color} fillOpacity={type === 'box 1' ? 0.6 : 0.8} />
                          ))
                        ) : (
                          d.rawData.filter(pt => pt.value < d.min || pt.value > d.max).map((pt, idx) => (
                            <circle key={`outlier-${idx}`} cx={pt.jitterOffset * boxWidth} cy={yScale(pt.value)} r={2} fill={d.color} fillOpacity={0.8} />
                          ))
                        )
                      )
                    )}

                    {(type === 'box 1' || type === 'box 2') && (
                      <>
                        {(!isLayoutSmall || type === 'box 1') ? (
                           <>
                             <line x1={0} x2={0} y1={yScale(d.min)} y2={yScale(d.q1)} stroke={d.color} strokeWidth={1} />
                             <line x1={0} x2={0} y1={yScale(d.q3)} y2={yScale(d.max)} stroke={d.color} strokeWidth={1} />
                             <line x1={-boxWidth * 0.3} x2={boxWidth * 0.3} y1={yScale(d.min)} y2={yScale(d.min)} stroke={d.color} strokeWidth={1} />
                             <line x1={-boxWidth * 0.3} x2={boxWidth * 0.3} y1={yScale(d.max)} y2={yScale(d.max)} stroke={d.color} strokeWidth={1} />
                           </>
                        ) : (
                           <line x1={0} x2={0} y1={yScale(d.min)} y2={yScale(d.max)} stroke={d.color} strokeWidth={0.5} strokeDasharray="2,2"/>
                        )}

                        <rect x={-boxWidth / 2} y={yScale(d.q3)} width={boxWidth} height={Math.max(1, yScale(d.q1) - yScale(d.q3))} fill={d.color} fillOpacity={0.45} stroke={d.color} strokeWidth={1.5} rx={1} />
                        <line x1={-boxWidth / 2} x2={boxWidth / 2} y1={yScale(d.median)} y2={yScale(d.median)} stroke={d.color} strokeWidth={1.5} />
                      </>
                    )}
                  </g>
                );
              })}

              {}
              <g transform={`translate(${innerWidth + 20}, 10)`}>
                <text x={0} y={0} fontSize="12px" fontWeight="bold" fill="#4b5563">
                   {type === 'scatter' ? "器件类型" : (type === 'line' ? "产品类别" : (type === 'box 2' ? "指标" : (type === 'bar' ? "类别" : "项/设备")))}
                </text>
                
                {type === 'scatter' && scatterGroups.map((g, i) => (
                    <g key={`legend-s-${i}`} transform={`translate(0, ${i * 24 + 20})`}>
                      {isScatterNarrow ? (
                         <circle cx={7} cy={-3} r={6} fill={g.color} fillOpacity={0.15} stroke={g.color} strokeWidth={1.5} />
                      ) : (
                         <circle cx={7} cy={-3} r={6} fill={g.color} fillOpacity={0.65} />
                      )}
                      <text x={24} y={2} fontSize="12px" fill="#6b7280">{g.name}</text>
                    </g>
                ))}

                {type === 'bar' && (
                    <g transform={`translate(0, 20)`}>
                      <rect x={0} y={-10} width={14} height={14} fill="#3b82f6" rx={2} />
                      <text x={24} y={2} fontSize="12px" fill="#6b7280">Count</text>
                    </g>
                )}

                {type === 'line' && data.map((series, i) => (
                    <g key={`legend-line-${i}`} transform={`translate(0, ${i * 24 + 20})`}>
                      <line x1={0} x2={16} y1={-3} y2={-3} stroke={series.color} strokeWidth={2} />
                      {isLineNarrow ? (
                        <rect x={5} y={-3.75} width={6} height={1.5} fill={series.color} /> 
                      ) : (
                        <circle cx={8} cy={-3} r={4} fill={series.color} />
                      )}
                      <text x={24} y={2} fontSize="12px" fill="#6b7280">{series.name}</text>
                    </g>
                ))}

                {type === 'box 2' && (
                    <g transform={`translate(0, 20)`}>
                      <rect x={0} y={-10} width={14} height={14} fill={colors[0]} fillOpacity={0.45} stroke={colors[0]} strokeWidth={1.5} rx={2} />
                      <text x={24} y={2} fontSize="12px" fill="#6b7280">RV3W0RST</text>
                    </g>
                )}

                {type === 'box 1' && data.map((d, i) => (
                    <g key={`legend-dist-${i}`} transform={`translate(0, ${i * 24 + 20})`}>
                      <rect x={0} y={-10} width={14} height={14} fill={d.color} fillOpacity={0.45} stroke={d.color} strokeWidth={1.5} rx={2} />
                      <text x={24} y={2} fontSize="12px" fill="#6b7280">{d.name}</text>
                    </g>
                ))}
              </g>
            </g>
          </svg>
        </div>
      );
    };

    // ---------------------------------------------------------
    // 3. 拖拽弹窗组件
    // ---------------------------------------------------------
    const DraggableWindow = ({ title, onClose, initialX, initialY, children }) => {
      const [pos, setPos] = useState({ x: initialX, y: initialY });
      const [size, setSize] = useState({ width: 600, height: 400 });
      const [isDragging, setIsDragging] = useState(false);
      const [isResizing, setIsResizing] = useState(false);
      const dragRef = useRef({ startX: 0, startY: 0, initialPosX: 0, initialPosY: 0 });
      const resizeRef = useRef({ startX: 0, startY: 0, initialWidth: 0, initialHeight: 0, direction: 'se' });
      
      const [forceDefault, setForceDefault] = useState(false);

      const handleDragStart = (e) => {
        if (e.target.closest('.resize-handle') || e.target.closest('.no-drag')) return;
        setIsDragging(true);
        dragRef.current = { startX: e.clientX, startY: e.clientY, initialPosX: pos.x, initialPosY: pos.y };
      };

      const handleDrag = (e) => {
        if (!isDragging) return;
        setPos({ x: dragRef.current.initialPosX + (e.clientX - dragRef.current.startX), y: dragRef.current.initialPosY + (e.clientY - dragRef.current.startY) });
      };

      const handleDragEnd = () => setIsDragging(false);

      const handleResizeStart = (e, direction) => {
        e.stopPropagation();
        setIsResizing(true);
        resizeRef.current = { startX: e.clientX, startY: e.clientY, initialWidth: size.width, initialHeight: size.height, direction };
      };

      const handleResize = (e) => {
        if (!isResizing) return;
        const { startX, startY, initialWidth, initialHeight, direction } = resizeRef.current;
        
        let newWidth = size.width;
        let newHeight = size.height;

        if (direction.includes('e')) {
            newWidth = Math.max(400, initialWidth + (e.clientX - startX));
        }
        if (direction.includes('s')) {
            newHeight = Math.max(300, initialHeight + (e.clientY - startY));
        }

        setSize({ width: newWidth, height: newHeight });
      };

      const handleResizeEnd = () => setIsResizing(false);

      useEffect(() => {
        if (isDragging || isResizing) {
          window.addEventListener('mousemove', isDragging ? handleDrag : handleResize);
          window.addEventListener('mouseup', isDragging ? handleDragEnd : handleResizeEnd);
        }
        return () => {
          window.removeEventListener('mousemove', isDragging ? handleDrag : handleResize);
          window.removeEventListener('mouseup', isDragging ? handleDragEnd : handleResizeEnd);
        };
      }, [isDragging, isResizing]);

      const isEffectivelySmall = size.width <= 500;

      return (
        <div className="absolute bg-white rounded-lg shadow-2xl border border-gray-300 flex flex-col" style={{ left: pos.x, top: pos.y, width: size.width, height: size.height, zIndex: 50 }}>
          <div className="bg-gray-100 border-b border-gray-200 px-4 py-2 flex justify-between items-center cursor-move select-none" onMouseDown={handleDragStart}>
            <span className="font-medium text-sm text-gray-700 flex-1">{title} - {size.width}x{size.height}px</span>
            
            {isEffectivelySmall && (
               <div 
                 className="no-drag flex items-center gap-2 mr-4 cursor-pointer group"
                 onClick={() => setForceDefault(!forceDefault)}
                 title="强制还原图表元素为大尺寸原貌"
               >
                 <span className="text-xs text-gray-600 font-medium group-hover:text-blue-600 transition-colors">原貌图形</span>
                 <div className={`w-7 h-4 rounded-full relative transition-colors duration-200 ease-in-out shadow-inner ${forceDefault ? 'bg-blue-500' : 'bg-gray-300'}`}>
                    <div className={`absolute top-0.5 left-0.5 w-3 h-3 rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out ${forceDefault ? 'translate-x-3' : 'translate-x-0'}`}></div>
                 </div>
               </div>
            )}

            <button onClick={onClose} className="no-drag text-gray-500 hover:text-red-500 font-bold leading-none p-1">✕</button>
          </div>
          <div className="flex-1 relative overflow-hidden bg-gray-50">
             {React.cloneElement(children, { width: size.width, height: size.height - 40, forceDefault })}
          </div>
          
          <div className="resize-handle absolute top-0 right-0 w-2 h-full cursor-e-resize z-10" onMouseDown={(e) => handleResizeStart(e, 'e')}></div>
          <div className="resize-handle absolute bottom-0 left-0 w-full h-2 cursor-s-resize z-10" onMouseDown={(e) => handleResizeStart(e, 's')}></div>
          <div className="resize-handle absolute bottom-0 right-0 w-4 h-4 cursor-se-resize z-20 bg-transparent" onMouseDown={(e) => handleResizeStart(e, 'se')}></div>
        </div>
      );
    };

    // ---------------------------------------------------------
    // 4. 主应用组件
    // ---------------------------------------------------------
    function App() {
      const [activeTab, setActiveTab] = useState('box 1');
      const [contextMenu, setContextMenu] = useState(null);
      const [screenshotWindows, setScreenshotWindows] = useState([]);
      const mainContainerRef = useRef(null);
      const [mainSize, setMainSize] = useState({ width: 800, height: 500 });

      useEffect(() => {
        const observer = new ResizeObserver(entries => {
          if(entries[0]) {
             setMainSize({ width: entries[0].contentRect.width, height: entries[0].contentRect.height });
          }
        });
        if(mainContainerRef.current) observer.observe(mainContainerRef.current);
        return () => observer.disconnect();
      }, []);

      const handleContextMenu = (e) => {
        e.preventDefault();
        // 确保弹窗不会溢出屏幕右下角导致布局问题
        const adjustedX = Math.min(e.clientX, window.innerWidth - 650);
        const adjustedY = Math.min(e.clientY, window.innerHeight - 450);
        setContextMenu({ 
            mouseX: e.clientX, 
            mouseY: e.clientY,
            windowX: adjustedX,
            windowY: adjustedY
        });
      };

      const handleTakeScreenshot = () => {
        setScreenshotWindows([...screenshotWindows, { id: Date.now(), x: contextMenu.windowX, y: contextMenu.windowY, type: activeTab }]);
        setContextMenu(null);
      };

      return (
        <div className="min-h-screen bg-gray-100 p-8 flex flex-col items-center relative overflow-hidden" onClick={() => setContextMenu(null)}>
          <div className="mb-6 text-center">
            <h1 className="text-2xl font-bold text-gray-800 mb-2">半导体良率分析仪表盘</h1>
            <p className="text-gray-600">在图表区域 <strong className="text-blue-600">右键点击</strong> 唤出截图菜单。拖拽截图窗口边缘体验自适应效果。</p>
          </div>

          <div className="w-full max-w-5xl bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden flex flex-col">
            <div className="flex justify-between items-end border-b border-gray-200 bg-gray-50 px-4 pt-2">
              <div className="flex flex-wrap gap-y-1">
                {['box 1', 'box 2', 'line', 'scatter', 'bar'].map(tab => (
                  <button
                    key={tab}
                    className={`px-6 py-3 font-medium text-sm transition-colors relative focus:outline-none ${activeTab === tab ? 'text-blue-600 bg-white border-t-2 border-t-blue-500 border-x border-x-gray-200 rounded-t-lg -mb-px z-10' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-100 border-t-2 border-t-transparent border-x border-x-transparent'}`}
                    onClick={() => setActiveTab(tab)}
                  >
                    {tab.toUpperCase()}
                  </button>
                ))}
              </div>
            </div>

            <div ref={mainContainerRef} className="w-full h-[600px] relative cursor-context-menu" onContextMenu={handleContextMenu}>
               <ResponsiveChart width={mainSize.width} height={mainSize.height} type={activeTab} forceDefault={false} />
            </div>
          </div>

          {contextMenu && (
            <div className="absolute bg-white shadow-xl rounded-md border border-gray-200 py-1 w-48 z-40" style={{ top: contextMenu.mouseY, left: contextMenu.mouseX }}>
              <button className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 hover:text-blue-600 flex items-center gap-2" onClick={handleTakeScreenshot}>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                截图
              </button>
            </div>
          )}

          {screenshotWindows.map(win => (
            <DraggableWindow key={win.id} title={`图表快照 - ${win.type.toUpperCase()}`} initialX={win.x} initialY={win.y} onClose={() => setScreenshotWindows(screenshotWindows.filter(w => w.id !== win.id))}>
              <ResponsiveChart type={win.type} />
            </DraggableWindow>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
